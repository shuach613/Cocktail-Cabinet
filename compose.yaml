# Paste this file directly into Synology Container Manager > Project.
# No .env file or manually generated secrets are needed.
services:
  cocktail-cabinet:
    image: ghcr.io/shuach613/cocktail-cabinet:latest
    container_name: cocktail-cabinet
    restart: unless-stopped
    init: true
    ports:
      - "1931:8080"
    environment:
      DATA_DIR: /data
      # Keep true when the app is served through Synology HTTPS reverse proxy.
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      # Optional: configure SMTP here to send invitations by email.
      # Without SMTP, the admin can copy one-time invitation links.
      # SMTP_HOST: "smtp.example.com"
      # SMTP_PORT: "587"
      # SMTP_USERNAME: ""
      # SMTP_PASSWORD: ""
      # SMTP_FROM: ""
      # SMTP_STARTTLS: "true"
    volumes:
      - cabinet_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    security_opt:
      - no-new-privileges:true

volumes:
  cabinet_data:
