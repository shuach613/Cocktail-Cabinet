<a class="recipe-card" href="{{ url_for('recipe_view',recipe_id=r.id) }}"><div class="card-visual visual-{{ r.technique|lower }}"><div class="card-decoration card-decoration-one"></div><div class="card-decoration card-decoration-two"></div>{% if r.image_file %}<img src="{{ url_for('media',filename=r.image_file) }}" alt="{{ r.title }}" loading="lazy">{% else %}<div class="glass-illustration"><div class="glass-rim"></div><div class="glass-beverage"></div><div class="glass-stem"></div></div>{% endif %}<span class="card-method">{{ r.technique }}</span></div><div class="card-content"><span class="card-caption">{{ r['items']|length }} INGREDIENTS <span>·</span> {{ r.glass or 'COCKTAIL' }}</span><h3>{{ r.title }}</h3><div class="card-foot"><span>{{ r['items'][:2]|map(attribute='name')|join(' · ') }}</span><span class="card-arrow">↗</span></div></div></a>
